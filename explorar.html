<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>Explorar — Curador CABA</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body data-page="explorar">
  <div id="shell"></div>
  <main class="container">
    <section class="panel filters-panel"><div class="panel-head"><div><span class="eyebrow">EXPLORADOR</span><h2>Filtrar actividad</h2></div><button id="clear-filters" class="button ghost" type="button">Limpiar filtros</button></div><div class="filters-grid"><label>Buscar<input id="filter-search" type="search" placeholder="Ciberseguridad, Línea F, Salud…" /></label><label>Organismo<select id="filter-org"><option value="">Todos</option></select></label><label>Tipo<select id="filter-type"><option value="">Todos</option></select></label><label>Categoría contratación<select id="filter-category"><option value="">Todas</option></select></label></div></section>
    <section class="two-col"><article class="panel"><div class="panel-head"><div><span class="eyebrow">CONTRATACIONES</span><h2>Distribución por categoría</h2></div><span id="procurement-total" class="badge">—</span></div><div id="category-bars" class="bar-list"></div></article><article class="panel"><div class="panel-head"><div><span class="eyebrow">ORGANISMOS</span><h2>Mayor actividad</h2></div></div><div id="org-ranking" class="ranking"></div></article></section>
    <section class="panel"><div class="panel-head"><div><span class="eyebrow">CONTRATACIONES</span><h2>Procesos</h2></div><span id="proc-result-count" class="badge">—</span></div><div id="procurement-list" class="record-list"></div><button id="procs-load-more" class="button ghost" type="button" style="display:none">Cargar más</button></section>
    <section class="panel"><div class="panel-head"><div><span class="eyebrow">NORMATIVA</span><h2>Normas</h2></div><span id="norm-result-count" class="badge">—</span></div><div id="norm-list" class="record-list"></div><button id="norms-load-more" class="button ghost" type="button" style="display:none">Cargar más</button></section>
  </main>
  <footer class="footer"><span>Curador CABA Intelligence · v2</span><span>Fuentes: Boletín Oficial CABA + BA Data/BAC · Gobierno de la Ciudad Autónoma de Buenos Aires</span></footer>
  <script src="./app.js" defer></script>
</body>
</html>
